name: Integration tests

on:
  push:
    branches-ignore:
      - "dependabot/**"
  pull_request:

# Cancel superseded runs of the same workflow on the same ref (e.g. after a
# force-push), so an in-progress run does not linger and surface as a spurious
# failure. push and pull_request runs for the same commit remain independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # https://endoflife.date/python
        # https://github.com/actions/runner-images/blob/main/images/linux/Ubuntu2204-Readme.md#python
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: start mongodb
        run: docker run --name mongo -p 127.0.0.1:27017:27017 -d mongo:latest

      - uses: actions/checkout@v7

      - name: set up python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - run: pip install -r requirements.txt

      - name: add test data to mongodb
        run: |
          echo 'db.messages.insertOne({
              user: "John Doe",
              createdAt: ISODate("3025-01-15T21:31:09.989Z"),
              updatedAt: ISODate("3025-01-15T21:31:09.989Z")
            });
            db.users.insertOne({
              username: "jdoe"
            });
            db.transactions.insertMany([
              { user: ObjectId("000000000000000000000001"), model: "gemini-flash", context: "message",
                tokenType: "prompt", rawAmount: -100, createdAt: ISODate("3025-01-15T21:31:09.989Z") },
              { user: ObjectId("000000000000000000000002"), model: "local-llm", context: "message",
                tokenType: "prompt", rawAmount: -100, createdAt: ISODate("3025-01-15T21:31:09.989Z") },
              { user: ObjectId("000000000000000000000002"), model: "gemini-flash", context: "message",
                tokenType: "prompt", rawAmount: -100, createdAt: ISODate("3025-01-15T21:31:09.989Z") },
              { user: ObjectId("000000000000000000000003"), model: "gemini-flash", context: "title",
                tokenType: "prompt", rawAmount: -100, createdAt: ISODate("3025-01-15T21:31:09.989Z") }
            ]);
            db.messages.insertOne({
              isCreatedByUser: false,
              endpoint: "custom",
              model: "local-llm",
              createdAt: ISODate("3025-01-15T21:31:09.989Z")
            });
            quit;' | docker exec -i mongo mongosh LibreChat

      - name: run exporter
        env:
          MONGODB_URI: "mongodb://127.0.0.1:27017/"
          LOGGING_LEVEL: debug
          METRICS_CACHE_ENABLED: "false"
          LIBRECHAT_URL: "http://localhost:8000"
          METRICS_TIMEZONE: "Asia/Tokyo"
          EXTERNAL_MODEL_REGEX: "gemini"
        run: python metrics.py &> exporter.log &

      - name: get metrics
        run: >
          curl -fisS --retry 60 --retry-delay 1 --retry-all-errors
          http://localhost:8000 -o metrics

      # Debug helpers — tolerate a missing file so a cancelled run is not
      # flipped to "failure" by these always() steps when the metrics file
      # was never written.
      - name: show metrics
        if: ${{ always() }}
        run: cat metrics || true

      - name: show log
        if: ${{ always() }}
        run: cat exporter.log || true

      - name: probe for valid output
        run: grep 'librechat_registered_users_total 1.0' metrics

      - name: probe for librechat status in output
        run: grep 'librechat_status_code' metrics

      # Label order in the output depends on the prometheus-client version, so
      # match each label separately. The title transaction must not count.
      - name: probe for usage window metrics
        run: |
          grep '^librechat_window_unique_users{window="1d"} 2.0' metrics
          grep '^librechat_window_users_by_model_class{' metrics | grep 'window="1d"' | grep 'usage="both"' | grep ' 1.0$'
          grep '^librechat_window_users_by_model_class{' metrics | grep 'window="1d"' | grep 'usage="external_only"' | grep ' 1.0$'
          grep '^librechat_window_answers_per_model{' metrics | grep 'model="local-llm"' | grep 'class="local"' | grep 'window="1d"' | grep ' 1.0$'
          grep '^librechat_window_tokens_per_model{' metrics | grep 'model="gemini-flash"' | grep 'type="input"' | grep 'window="1d"' | grep ' 200.0$'
